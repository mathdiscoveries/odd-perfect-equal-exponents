# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Odd Perfect Numbers: Equal Non-Special Exponents for Every Odd Prime 3 <= r <= 73"
  description: >-
    Unconditional Lean 4 + Mathlib formalization proving that no odd perfect
    number N = pi^alpha * q_1^(r-1) * ... * q_t^(r-1) has every non-special
    prime raised to the same exponent r - 1 for any odd prime 3 <= r <= 73
    (all 20 odd primes, 1 <= beta <= 36 where r = 2*beta + 1), together with
    Theorem 1 of the companion paper (notSpecial_of_prime, implied by Kanold's
    1941 congruence) that r cannot be the special prime for any odd prime
    r >= 3. Formalizes the companion paper's proof (Theorem 2, cases
    r <= 73), which gives second proofs of the 9 prime cases in this range
    excluded in earlier work and treats the 11 other prime cases through
    r = 73 (including beta = 9, 15, 20, 21, 23, attempted without success by
    Cohen and Williams 1985, plus r = 53, 59, 61, 67, 71, 73). Companion
    write-up, additional larger
    certificates through r = 167 (not packaged in this single repository due to
    certificate size), and dated literature search logs are published at
    https://mathdiscoveries.org/results/odd-perfect-equal-exponents. Coverage
    by this package's Palomar comparison: of the companion paper's 3 main
    results, 1 is compared in Lean in full (33%; Theorem 1) and 1 in part
    (Theorem 2 for the 20 odd primes r <= 73; its cases r = 79 and 83, which
    the paper reports as checked in its own Lean library, are not in this
    package); Theorem 3 (89 <= r <= 167) is by certificate only. Abstract
    claims: the same 3 results, with the same split.
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11A25", "11Y70"]

sources:
  - title: "Extensions of some results concerning odd perfect numbers"
    authors:
      - "Graeme L. Cohen"
      - "R. J. Williams"
    id: "https://www.fq.math.ca/Scanned/23-1/cohen.pdf"
    type: paper
    location: "Fibonacci Quarterly 23(1) (1985), 70-76"
    relationship: independently-proves
    note: >-
      Excludes beta = 6, 8, 11, 14, 18 (including prime cases r = 13, 17, 23,
      29, 37 independently proved here), states Kanold's (1941) fact p != r
      (proved unconditionally for all odd primes r >= 3 in notSpecial_of_prime),
      and describes unsuccessful attempts at beta = 9, 15, 20, 21, 23
      (r = 19, 31, 41, 43, 47, treated in Theorem 2 of the companion paper).
  - title: "Some results concerning the non-existence of odd perfect numbers of the form p^alpha M^{2beta}"
    authors:
      - "Wayne L. McDaniel"
      - "Peter Hagis Jr."
    type: paper
    location: "Fibonacci Quarterly 13(1) (1975), 25-28"
    relationship: independently-proves
    note: >-
      Excludes beta = 5, 12, 17, 24, 62 (including prime case r = 11
      independently proved here), following Steuerwald (1937, beta = 1),
      Kanold (1941, beta = 2), McDaniel (1970, beta = 1 mod 3), and Hagis and
      McDaniel (1972, beta = 3). The companion paper reports reading it in
      full; McDaniel (1970) is unread [to check].
  - title: "More on the Nonexistence of Odd Perfect Numbers of a Certain Form"
    authors:
      - "Patrick A. Brown"
    id: "https://arxiv.org/abs/1512.01270"
    type: paper
    location: "arXiv:1512.01270 (2015)"
    relationship: background
    note: >-
      Excludes beta = 2 (mod 5) (following Fletcher-Nielsen-Ochem 2012),
      consulted in the prior-work check alongside Yamada (arXiv:2312.17059) and
      Gallardo-Rahavandrainy (arXiv:2304.04109).
  - title: "On a theorem of Kanold on odd perfect numbers"
    authors:
      - "Tomohiro Yamada"
    id: "https://arxiv.org/abs/2312.17059"
    type: paper
    location: "arXiv:2312.17059 (2023)"
    relationship: background
    note: >-
      Improves Kanold's fourth-power divisibility to t^5 | N for a common
      divisor t of all 2 beta_i + 1 (Theorem 1); published in Indian J. Pure
      Appl. Math. 56 (2025), 1278-1284.
  - title: "Untersuchungen über ungerade vollkommene Zahlen"
    authors:
      - "Hans-Joachim Kanold"
    type: paper
    location: "J. Reine Angew. Math. 183 (1941), 98-109"
    relationship: independently-proves
    note: >-
      Section IV proves the congruence pi = 1 (mod r) for the special prime
      when every non-special exponent plus one is a positive power of the same
      prime r, which implies Theorem 1 of the companion paper
      (notSpecial_of_prime), and excludes the case in which every non-special
      exponent is 4 (r = 5). Both are proved here independently
      (notSpecial_of_prime by a congruence for the divisor sum). The companion paper reports reading it
      in full.
  - title: "Verschärfung einer notwendigen Bedingung für die Existenz einer ungeraden vollkommenen Zahl"
    authors:
      - "R. Steuerwald"
    type: paper
    location: "S.-B. Bayer. Akad. Wiss. (1937), 69-72"
    relationship: independently-proves
    note: >-
      Its condition, that at least one ordinary exponent be at least four,
      excludes the case r = 3, which is proved here independently. The
      companion paper reports reading it in full.
  - title: "A new result concerning the structure of odd perfect numbers"
    authors:
      - "Peter Hagis Jr."
      - "Wayne L. McDaniel"
    type: paper
    location: "Proc. Amer. Math. Soc. 32 (1972), 13-15"
    relationship: independently-proves
    note: >-
      Excludes the case in which every non-special exponent is 6 (r = 7),
      which is proved here independently. The companion paper reports reading
      it in full.
  - title: "Odd Perfect Numbers with Equal Non-Special Exponents r - 1: Exclusion Through 167, with Kernel Proofs Through 83"
    authors:
      - "Tyler B. Hughes"
    id: "https://mathdiscoveries.org/results/odd-perfect-equal-exponents"
    type: paper
    location: "https://mathdiscoveries.org/results/odd-perfect-equal-exponents"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The companion paper. It states and proves in writing every compared
      statement of this package (Theorem 1, Theorem 2 for r <= 73, whose
      certificates and soundness argument the paper explains and the Lean
      kernel checks, and the three predicate examples of Section 2), and the
      Lean work formalizes them; the formalization presents no result that the
      paper does not. The prime cases r = 3, 5, 7, 11, 13, 17, 23, 29, 37 are
      printed prior work, listed above; the proofs of them here are second
      proofs. The paper's cases 79 <= r <= 167 are not in this package. Dated
      prior-work searches (OpenAlex, Semantic Scholar, arXiv, zbMATH Open,
      Crossref, HAL, OEIS, GitHub, Zenodo, Stack Exchange, and Google Scholar
      through 2026-11-22) did not find prior proofs of the 11 prime cases
      r = 19, 31, 41, 43, 47, 53, 59, 61, 67, 71, 73. AI research agents built
      and directed by Tyler B. Hughes generated and checked this work. No human
      mathematician has yet refereed the proof.

related_formalizations: []

status:
  scope: >-
    Unconditionally proved in Lean 4 + Mathlib with standard axioms only (zero
    sorry, zero native_decide): notSpecial_of_prime for every odd prime r >= 3,
    no_odd_perfect_equal_exponents_all_primes_le_73 covering all 20 odd primes
    3 <= r <= 73 (every beta <= 36 with 2*beta + 1 prime), and non-vacuity
    checks (perfect_six, equalExponents_3_2205, equalExponents_19_1937102445).
    Larger prime cases 79 <= r <= 167 are not included in this repository to
    keep certificate size tractable for single-run multi-kernel verification.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

automation:
  methods:
    - method: agent
      models: []
      framework: "AI research agent pipeline built and directed by Tyler B. Hughes"
      tool_setup: >-
        Autonomous builder, adversarial falsifier, and reviewer agents searched
        cyclotomic contradiction certificates, formalized the soundness engine
        and Kanold's theorem in Lean 4 + Mathlib, and verified every case
        r <= 73 in the kernel.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Goal-directed mathematical discovery and Lean 4 formalization."
  spend_usd: "not tracked"
  notes: >-
    All certificates, Lean 4 proofs, and internal adversarial reviews were
    produced by AI research agents built and directed by Tyler B. Hughes. No
    human mathematician has yet refereed the proof.

fidelity:
  divergences: ""

review:
  status: agent-reviewed
  reviewers:
    - "Internal adversarial falsifier and reviewer agents"
  notes: >-
    Checked by separate internal falsifier and reviewer agents and audited for
    standard axioms only via Opn/Verify.lean. Not yet refereed by a human
    mathematician.

alignment:
  namespace: "OpnChallenge"
  statements:
    - source: "Theorem 1 of the companion paper (implied by Kanold 1941): odd prime r >= 3 cannot be the special prime"
      lean: "OpnChallenge.notSpecial_of_prime"
      module: "Challenge"
      status: proved
      note: "Proved unconditionally for every odd prime r >= 3."
    - source: "No equal-exponent odd perfect number for any odd prime 3 <= r <= 73"
      lean: "OpnChallenge.no_odd_perfect_equal_exponents_all_primes_le_73"
      module: "Challenge"
      status: proved
      note: "Covers all 20 odd primes through r = 73 (including beta = 9, 15, 20, 21, 23, 26, 29, 30, 33, 35, 36)."
    - source: "Non-vacuity: 6 is perfect"
      lean: "OpnChallenge.perfect_six"
      module: "Challenge"
      status: proved
      note: "Confirms Nat.Perfect is non-vacuous."
    - source: "Non-vacuity: EqualExponents 3 2205"
      lean: "OpnChallenge.equalExponents_3_2205"
      module: "Challenge"
      status: proved
      note: "Confirms EqualExponents 3 is non-vacuous."
    - source: "Non-vacuity: EqualExponents 19 1937102445"
      lean: "OpnChallenge.equalExponents_19_1937102445"
      module: "Challenge"
      status: proved
      note: "Confirms EqualExponents 19 is non-vacuous."

acknowledgements: "Built on Lean 4 and Mathlib."
